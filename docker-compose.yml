services:
  postgres:
    image: postgres:16
    container_name: hikari_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hackaton}
      POSTGRES_USER: ${POSTGRES_USER:-usuario_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tu_contraseña_segura}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - hikari_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usuario_admin} -d ${POSTGRES_DB:-hackaton}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hikari_postgres_data:
